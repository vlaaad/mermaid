<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlantis · Mermaid</title>
<link rel="preload" as="fetch" crossorigin href="{{exe-name}}_wasm.js">
<link rel="preload" as="fetch" crossorigin href="{{exe-name}}.wasm">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071e2e;color:#d9f3f4;font-family:system-ui,sans-serif}body{display:grid;place-items:center}
#app-container{position:relative}#canvas{display:block;width:100%;height:100%;outline:none}#canvas-container{width:100%;height:100%}
#identity{position:absolute;left:30px;top:25px;pointer-events:none;text-shadow:0 2px 12px #163e4e66;transition:opacity 1s}#identity small{font-size:9px;letter-spacing:.35em;opacity:.65}#identity h1{font-family:Georgia,serif;font-size:26px;font-weight:400;letter-spacing:.20em;margin:5px 0}
#controls{position:absolute;bottom:24px;left:30px;font-size:11px;letter-spacing:.06em;text-shadow:0 2px 5px #073146;opacity:.72;pointer-events:none}#controls kbd{font:inherit;color:#fff}
#fullscreen{position:absolute;right:24px;bottom:20px;color:#ddf8f7;background:#123c4e44;border:1px solid #c8ffff33;border-radius:4px;padding:6px 10px;font-size:10px;cursor:pointer}
#depth{position:absolute;right:28px;top:26px;font-size:12px;letter-spacing:.08em;opacity:.8;pointer-events:none;text-shadow:0 2px 5px #073146}
#loading{position:absolute;inset:0;display:grid;place-content:center;background:#0d344b;font-size:13px;letter-spacing:.12em;pointer-events:none}
#debug{display:none;position:absolute;right:15px;top:15px;padding:12px;background:#061a2de6;font:11px/1.5 monospace;white-space:pre;max-width:400px;pointer-events:none;color:#d7fff2}
#save-frame{position:absolute;right:15px;top:210px;padding:8px 12px;background:#123747;color:#caffed;border:1px solid #9cdbd777;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<main id="app-container">
 <div id="canvas-container"><canvas id="canvas" tabindex="0" width="{{display.width}}" height="{{display.height}}" aria-label="Underwater Atlantis game"></canvas></div>
 <div id="identity"><small>THE SUNKEN CITY</small><h1>ATLANTIS</h1></div>
 <output id="depth" aria-label="Depth below surface"></output>
 <div id="controls">Click to steer &nbsp; · &nbsp; Mouse aim &nbsp; · &nbsp; <kbd>W</kbd> swim &nbsp; · &nbsp; <kbd>Tab / Esc</kbd> release &nbsp; · &nbsp; <kbd>Shift</kbd> boost &nbsp; · &nbsp; <kbd>R</kbd> return</div>
 <button id="fullscreen" aria-label="Fullscreen">⤢ Fullscreen</button>
 <div id="loading">DRIFTING INTO ATLANTIS…</div>
 <output id="debug" aria-label="Developer performance and state"></output>
 <button id="save-frame" hidden>Save frame and timings</button>
</main>
<script src="dmloader.js"></script>
<script>
const query=new URLSearchParams(location.search);
const capture=query.has('capture');
const debug=query.has('debug');
if(capture){document.querySelector('#identity').hidden=true;document.querySelector('#controls').hidden=true;document.querySelector('#fullscreen').hidden=true;document.querySelector('#depth').hidden=true;}
const debugPanel=document.querySelector('#debug');
if(debug)debugPanel.style.display='block';
const saveButton=document.querySelector('#save-frame');
saveButton.hidden=!debug;
CUSTOM_PARAMETERS.resize_window_callback=function(){
 const w=Math.min(innerWidth,innerHeight*16/9),h=w*9/16;
 const app=document.querySelector('#app-container'),canvas=document.querySelector('#canvas');
 app.style.width=w+'px';app.style.height=h+'px';
 // Bound framebuffer independently of OS DPR; default to at most full HD.
 const resolution=Number(query.get('width'))||Math.min(1920,Math.round(w));
 const rw=Math.max(640,Math.min(1920,resolution));
 const rh=Math.round(rw*9/16);
 if(canvas.width!==rw||canvas.height!==rh){canvas.width=rw;canvas.height=rh;}
};
CUSTOM_PARAMETERS.update_progress=p=>{document.querySelector('#loading').textContent='DRIFTING INTO ATLANTIS… '+Math.round(p)+'%';};
CUSTOM_PARAMETERS.start_error=e=>{document.querySelector('#loading').textContent='Unable to enter Atlantis: '+e;};
if(query.has('trace'))CUSTOM_PARAMETERS.engine_arguments.push('--config=profiler.performance_timeline_enabled=1');
CUSTOM_PARAMETERS.engine_arguments.push('--config=display.update_frequency=0');
document.querySelector('#fullscreen').addEventListener('click',()=>document.querySelector('#app-container').requestFullscreen());
document.querySelector('#canvas').addEventListener('contextmenu',e=>e.preventDefault());
// Request in the browser's user gesture. The engine receives mouse input on
// its following frame, after the transient activation may have expired.
document.querySelector('#canvas').addEventListener('pointerdown',e=>{
 if(e.button===0&&window.mermaidState?.ready&&!document.pointerLockElement)
  document.querySelector('#canvas').requestPointerLock()?.catch(()=>{});
});
document.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();});
let previous=0,deltas=[],wasReady=false,renderer='';
function sample(t){
 if(previous&&document.visibilityState==='visible'){const dt=t-previous;if(dt>0&&dt<500)deltas.push(dt);if(deltas.length>600)deltas.shift();}previous=t;
 requestAnimationFrame(sample);
}
requestAnimationFrame(sample);
setInterval(()=>{
 const s=window.mermaidState;
 if(!s||!s.ready)return;
 if(!wasReady){deltas=[];previous=0;wasReady=true;}
 document.querySelector('#loading').hidden=true;
 document.querySelector('#depth').textContent=Math.round(s.depth)+' m';
 if(s.speed>.1)document.querySelector('#identity').style.opacity='0';
 if(debug){
  const sorted=[...deltas].sort((a,b)=>a-b),avg=deltas.reduce((a,b)=>a+b,0)/Math.max(1,deltas.length);
  const canvas=document.querySelector('#canvas');
  if(!renderer){const gl=canvas.getContext('webgl2')||canvas.getContext('webgl');if(gl){const ext=gl.getExtension('WEBGL_debug_renderer_info');renderer=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);}}
  debugPanel.textContent=`FRAMEBUFFER ${canvas.width} × ${canvas.height}\nRAF ${deltas.length} samples | ${(1000/avg).toFixed(1)} FPS\nframe mean ${avg.toFixed(2)} ms | p95 ${(sorted[Math.floor(sorted.length*.95)]||0).toFixed(2)} ms\nGAME frame ${s.frame_ms.toFixed(2)} ms | ${s.frames}\nPLAYER ${s.position.x.toFixed(2)}, ${s.position.y.toFixed(2)}, ${s.position.z.toFixed(2)}\nSPEED ${s.speed.toFixed(2)} m/s | frozen ${s.frozen}\nAIM ${s.yaw.toFixed(2)}, ${s.pitch.toFixed(2)} | steering ${s.steering}\nINPUT ${s.last_input}\n${renderer}`;
 }
},250);
EngineLoader.load('canvas','{{exe-name}}');
saveButton.addEventListener('click',()=>{
 const canvas=document.querySelector('#canvas');
 let retries=0;
 function captureFrame(){
  const copy=document.createElement('canvas');copy.width=canvas.width;copy.height=canvas.height;
  const context=copy.getContext('2d');context.drawImage(canvas,0,0);
  const probe=context.getImageData(Math.floor(copy.width/2),Math.floor(copy.height/2),1,1).data;
  if(probe[0]+probe[1]+probe[2]<6){if(retries++<20){requestAnimationFrame(captureFrame);return;}saveButton.textContent='Frame unavailable; retry capture';return;}
  const sorted=[...deltas].sort((a,b)=>a-b),mean=deltas.reduce((a,b)=>a+b,0)/Math.max(1,deltas.length);
  const report={png:copy.toDataURL('image/png').split(',')[1],state:window.mermaidState,framebuffer:[canvas.width,canvas.height],raf:{samples:deltas.length,mean_ms:mean,p95_ms:sorted[Math.floor(sorted.length*.95)],fps:1000/mean},renderer,trace_enabled:query.has('trace'),captured_at:new Date().toISOString()};
  fetch('/__capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)}).then(r=>{if(!r.ok)throw Error('Use python3 tools/serve.py');return r.json();}).then(()=>saveButton.textContent='Saved browser.png + metrics').catch(e=>saveButton.textContent=e.message);
 }
 requestAnimationFrame(captureFrame);
});
</script>
</body>
</html>
